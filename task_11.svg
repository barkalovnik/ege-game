<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <rect width="1000" height="240" fill="#ffffff"/>
  <rect x="15" y="15" width="34" height="34" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="32" y="38" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">1</text>
  
  <text x="65" y="38" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000">Тип 11 № <tspan fill="#003399" text-decoration="underline">27409</tspan></text>
  <circle cx="215" cy="32" r="10" fill="#888888"/>
  <circle cx="245" cy="32" r="10" fill="#dd3333"/>
  <text x="245" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <circle cx="275" cy="32" r="10" fill="#3388cc"/>
  <text x="275" y="38" font-family="serif" font-size="16" font-style="italic" fill="#ffffff" text-anchor="middle">i</text>

  <text x="20" y="80" font-family="sans-serif" font-size="17" fill="#111111">
    При регистрации в компьютерной системе каждому пользователю выдаётся пароль, состоящий из 11 символов.
  </text>
  <text x="20" y="110" font-family="sans-serif" font-size="17" fill="#111111">
    В качестве символов используются 26 прописных букв латинского алфавита. В базе данных для хранения сведений
  </text>
  <text x="20" y="140" font-family="sans-serif" font-size="17" fill="#111111">
    о каждом пароле отведено одинаковое и минимально возможное целое число байт. Для каждого пароля используется
  </text>
  <text x="20" y="170" font-family="sans-serif" font-size="17" fill="#111111">
    посимвольное кодирование, все символы кодируются одинаковым и минимально возможным количеством бит.
  </text>
  <text x="20" y="210" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111111">
    Определите объём памяти (в байтах), необходимый для хранения 20 паролей. В ответе запишите только число.
  </text>
</svg>
